<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nader ❤️ Youmna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; }
        
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-500 { animation-delay: 0.5s; }
        .delay-700 { animation-delay: 0.7s; }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: rgba(255, 192, 203, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .timeline-icon-container {
            background: linear-gradient(135deg, #ec4899, #e11d48);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
        }

        .music-playing {
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(236, 72, 153, 0.5); }
            50% { box-shadow: 0 0 25px rgba(236, 72, 153, 0.9); }
            100% { box-shadow: 0 0 10px rgba(236, 72, 153, 0.5); }
        }

        .hearts-bg-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .slide-div { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; will-change: opacity; transition: opacity 2000ms ease-in-out; }
        .slide-div.active { opacity: 1; }

        .floating-heart {
            position: absolute; bottom: -10%;
            color: rgba(255, 150, 170, 0.5);
            font-size: 24px;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 0.7; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-120vh) scale(1.2) rotate(360deg); opacity: 0; }
        }
    </style>
</head>

<body class="relative min-h-screen flex items-center justify-center text-white overflow-x-hidden bg-gray-950">

    <div id="slideshow-container" class="absolute inset-0 z-[-2]"></div>

    <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-900/80 to-pink-950/70 z-[-1]"></div>
    
    <div class="hearts-bg-container" id="hearts-canvas"></div>

    <audio id="bg-music" loop>
        <source src="your-music-file.mp3" type="audio/mpeg">
    </audio>

    <button id="music-toggle" class="fixed bottom-6 right-6 z-50 glass-card p-4 rounded-full text-pink-200 hover:text-white transition-all duration-300 group">
        <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
    </button>

    <div class="relative z-10 w-full max-w-4xl px-4 md:px-8 py-20 flex flex-col items-center">

        <div class="text-center fade-up delay-100 mb-14">
            <h1 class="text-5xl md:text-7xl font-black mb-4 tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-rose-400 to-pink-300 drop-shadow-[0_2px_10px_rgba(236,72,153,0.5)]">
                نادر ❤️ يمنى
            </h1>
            <p class="text-pink-200/90 text-lg md:text-2xl font-semibold tracking-wide">
                بداية رحلتنا الأبدية
                <br>
                <span class="text-sm md:text-base opacity-80">منذ 19 أبريل 2026 - 8:00 مساءً</span>
            </p>
        </div>

        <div class="glass-card rounded-[2rem] p-6 md:p-10 w-full fade-up delay-200 mb-20 hover:scale-[1.01] transition-transform duration-500">
            <div class="grid grid-cols-3 md:grid-cols-6 gap-y-6 gap-x-4 text-center">
                <div class="flex flex-col items-center">
                    <div id="years" class="text-4xl md:text-5xl font-extrabold text-white drop-shadow-md">0</div>
                    <span class="text-pink-300/80 mt-2 text-sm md:text-base font-bold">سنة</span>
                </div>
                <div class="flex flex-col items-center">
                    <div id="months" class="text-4xl md:text-5xl font-extrabold text-white drop-shadow-md">0</div>
                    <span class="text-pink-300/80 mt-2 text-sm md:text-base font-bold">شهر</span>
                </div>
                <div class="flex flex-col items-center">
                    <div id="days" class="text-4xl md:text-5xl font-extrabold text-white drop-shadow-md">0</div>
                    <span class="text-pink-300/80 mt-2 text-sm md:text-base font-bold">يوم</span>
                </div>
                <div class="flex flex-col items-center">
                    <div id="hours" class="text-4xl md:text-5xl font-extrabold text-white drop-shadow-md">0</div>
                    <span class="text-pink-300/80 mt-2 text-sm md:text-base font-bold">ساعة</span>
                </div>
                <div class="flex flex-col items-center">
                    <div id="minutes" class="text-4xl md:text-5xl font-extrabold text-white drop-shadow-md">0</div>
                    <span class="text-pink-300/80 mt-2 text-sm md:text-base font-bold">دقيقة</span>
                </div>
                <div class="flex flex-col items-center relative">
                    <div id="seconds" class="text-4xl md:text-5xl font-extrabold text-rose-400 drop-shadow-md">0</div>
                    <span class="text-rose-400/80 mt-2 text-sm md:text-base font-bold">ثانية</span>
                    <div class="absolute inset-0 bg-rose-500/20 blur-xl rounded-full animate-pulse z-[-1]"></div>
                </div>
            </div>
        </div>

        <div class="w-full max-w-3xl fade-up delay-300 relative">
            <div class="flex items-center justify-center mb-12 opacity-90">
                <div class="h-px bg-gradient-to-r from-transparent to-pink-400 flex-grow max-w-[100px]"></div>
                <h2 class="text-3xl font-bold text-center mx-4 text-pink-200 drop-shadow">محطات حبنا</h2>
                <div class="h-px bg-gradient-to-l from-transparent to-pink-400 flex-grow max-w-[100px]"></div>
            </div>
            
            <div class="relative py-4">
                <div class="absolute right-8 md:right-10 top-0 bottom-0 w-1 bg-gradient-to-b from-pink-400 via-rose-600 to-pink-900 rounded-full opacity-80"></div>

                <div class="space-y-16 relative">
                    <div class="relative pr-20 md:pr-24 fade-up delay-500 group">
                        <div class="absolute right-1 md:right-3 top-0 w-14 h-14 md:w-16 md:h-16 timeline-icon-container rounded-full flex items-center justify-center z-10 border-4 border-gray-900/80 group-hover:scale-125 transition-transform duration-300">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white drop-shadow" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <div class="glass-card p-6 md:p-8 rounded-[2rem] relative overflow-hidden group hover:border-pink-500/40 transition-all duration-500">
                            <h3 class="font-extrabold text-2xl text-pink-100 mb-2">أول لقاء</h3>
                            <p class="text-pink-300/90 text-base md:text-lg font-semibold">19 أبريل 2026</p>
                            <p class="text-gray-300/70 text-sm mt-3 leading-relaxed">اليوم الذي بدأت فيه حكايتنا، ونبضت قلوبنا لأول مرة معاً.</p>
                        </div>
                    </div>

                    <div class="relative pr-20 md:pr-24 fade-up delay-700 group" style="animation-delay: 0.9s;">
                        <div class="absolute right-1 md:right-3 top-0 w-14 h-14 md:w-16 md:h-16 timeline-icon-container rounded-full flex items-center justify-center z-10 border-4 border-gray-900/80 group-hover:scale-125 transition-transform duration-300">
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white drop-shadow" viewBox="0 0 64 64" fill="currentColor">
  <!-- الفص العلوي (الحجر) -->
  <polygon points="32,4 44,18 32,24 20,18" fill="white" opacity="0.95"/>
  <polygon points="32,4 44,18 32,14" fill="white" opacity="0.6"/>
  <!-- جسم الخاتم -->
  <path d="M20,18 Q10,28 12,40 Q14,52 32,56 Q50,52 52,40 Q54,28 44,18 L32,24 Z" fill="white" opacity="0.85"/>
  <!-- لمعة -->
  <ellipse cx="28" cy="36" rx="5" ry="8" fill="white" opacity="0.15" transform="rotate(-15,28,36)"/>
</svg>
                        <div class="glass-card p-6 md:p-8 rounded-[2rem] relative overflow-hidden group hover:border-pink-500/50 transition-all duration-500 border-pink-500/20">
                            <h3 class="font-extrabold text-2xl text-pink-50 mb-2 drop-shadow-sm">الخطوبة</h3>
                            <p class="text-rose-300 text-base md:text-lg font-bold">5 مايو 2026</p>
                            <p class="text-pink-100/80 text-sm mt-3 leading-relaxed">أجمل يوم، حيث أعلنّا للعالم أننا لبعضنا البعض.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Background Slideshow Logic ---
        const images = Array.from({ length: 28 }, (_, i) => `${i + 1}.jpg`);
        const slideContainer = document.getElementById('slideshow-container');
        let currentSlide = 0;
        let slides = [];

        images.forEach((src, index) => {
            const div = document.createElement('div');
            div.className = 'slide-div';
            if (index === 0) {
                div.style.backgroundImage = `url('${src}')`;
                div.classList.add('active');
            } else if (index === 1) {
                div.style.backgroundImage = `url('${src}')`;
            } else {
                div.dataset.src = src;
            }
            if (window.innerWidth > 768) div.style.backgroundAttachment = 'fixed';
            slideContainer.appendChild(div);
            slides.push(div);
        });

        function preloadNext(idx) {
            const next = slides[(idx + 1) % slides.length];
            if (next.dataset.src) {
                next.style.backgroundImage = `url('${next.dataset.src}')`;
                delete next.dataset.src;
            }
        }

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
            preloadNext(currentSlide);
        }
        
        setTimeout(() => { setInterval(nextSlide, 5000); }, 2000);


        // --- 2. Music Player Logic ---
        const audio = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-toggle');
        const playIcon = document.getElementById('icon-play');
        const pauseIcon = document.getElementById('icon-pause');
        let isPlaying = false;

        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                musicBtn.classList.remove('music-playing');
            } else {
                audio.play();
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                musicBtn.classList.add('music-playing');
            }
            isPlaying = !isPlaying;
        });


        // --- 3. Floating Hearts Animation ---
        const heartsCanvas = document.getElementById('hearts-canvas');
        const heartSymbols = ['❤', '💖', '💗', '✨'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 6 + 6;
            heart.style.animationDuration = duration + 's';
            setTimeout(() => { heart.remove(); }, duration * 1000);
            heartsCanvas.appendChild(heart);
        }
        setInterval(createHeart, 400);
        for(let i=0; i<15; i++) setTimeout(createHeart, Math.random()*3000);


        // --- 4. Accurate Countdown Timer Logic ---
        function updateTimer() {
            const startDate = new Date('2026-04-19T20:00:00+02:00');
            const now = new Date();
            const diff = Math.max(0, now - startDate);

            const MS_PER_SECOND = 1000;
            const MS_PER_MINUTE = MS_PER_SECOND * 60;
            const MS_PER_HOUR   = MS_PER_MINUTE * 60;
            const MS_PER_DAY    = MS_PER_HOUR * 24;

            const seconds = Math.floor(diff / MS_PER_SECOND) % 60;
            const minutes = Math.floor(diff / MS_PER_MINUTE) % 60;
            const hours   = Math.floor(diff / MS_PER_HOUR)   % 24;

            let years  = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth()    - startDate.getMonth();
            if (months < 0) { months += 12; years--; }

            let ref = new Date(startDate);
            ref.setFullYear(ref.getFullYear() + years);
            ref.setMonth(ref.getMonth() + months);

            let days = Math.floor((now - ref) / MS_PER_DAY);

            if (days < 0) {
                months--;
                if (months < 0) { months += 12; years--; }
                ref = new Date(startDate);
                ref.setFullYear(ref.getFullYear() + years);
                ref.setMonth(ref.getMonth() + months);
                days = Math.floor((now - ref) / MS_PER_DAY);
            }

            years  = Math.max(0, years);
            months = Math.max(0, months);
            days   = Math.max(0, days);

            document.getElementById("years").innerText   = years;
            document.getElementById("months").innerText  = months;
            document.getElementById("days").innerText    = days;
            document.getElementById("hours").innerText   = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>

</body>
</html>
